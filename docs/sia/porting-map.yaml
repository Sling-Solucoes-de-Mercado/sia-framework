# ─────────────────────────────────────────────────────────────
# SIA ← AIOX: mapa de portabilidade
#
# Cada artefato do SIA, sua origem no AIOX (rastreabilidade) e o lote de
# construção. Caminhos de origem são relativos a .aiox-core/ quando não
# indicado o contrário. "new" = artefato novo, sem origem no AIOX.
#
# Lotes (batch):
#   B0  fundação (constitution, config, agentes, guia)
#   B1  @pm produto/análise/orquestração + tasks compartilhadas
#   B2  @pm stories/backlog/qualidade
#   B3  @dev desenvolvimento + arquitetura
#   B4  @dev dados (Supabase)
#   B5  @dev UX/UI
#   B6  @devops + facilitador de MCP + Vercel
#   B7  @squad-creator (squads + construção de framework)
#   B8  templates, checklists e data de @pm e @dev (núcleo)
#   B9  @validator + workflows + regras + workflow-chains
#   B10 CLI, hooks, skills e projeções de IDE
# ─────────────────────────────────────────────────────────────

agents:
  pm:            { name: Mira,  batch: B0, source: [development/agents/pm.md, development/agents/po.md, development/agents/sm.md, development/agents/qa.md, development/agents/analyst.md, development/agents/aiox-master.md] }
  dev:           { name: Davi,  batch: B0, source: [development/agents/dev.md, development/agents/architect.md, development/agents/data-engineer.md, development/agents/ux-design-expert.md] }
  devops:        { name: Lance, batch: B0, source: [development/agents/devops.md] }
  validator:     { name: Vera,  batch: B0, source: ["../.validator/METHOD.md", "../.claude/skills/validator/SKILL.md"] }
  squad-creator: { name: Elo,   batch: B0, source: [development/agents/squad-creator.md, development/agents/aiox-master.md] }

