# Template do Project Brief, a base do PRD.
# Usado por: @pm [Análise] em *create-project-brief, via task create-doc.
template:
  id: project-brief-template
  name: Project Brief
  version: 1.0
  output:
    format: markdown
    filename: docs/brief.md
    title: "Project Brief: {{project_name}}"

workflow:
  mode: interactive
  elicitation: advanced-elicitation
  custom_elicitation:
    title: Ações de elicitação do Project Brief
    options:
      - Expandir a seção com detalhes mais específicos
      - Validar contra produtos semelhantes que deram certo
      - Testar as premissas com casos extremos
      - Explorar abordagens alternativas de solução
      - Analisar os trade-offs entre recursos e restrições
      - Gerar estratégias de mitigação de riscos
      - Questionar o escopo pela ótica de um MVP mínimo
      - Fazer brainstorming de possibilidades criativas de funcionalidade
      - "Se ao menos tivéssemos [recurso/capacidade/tempo]..."
      - Seguir para a próxima seção

sections:
  - id: introduction
    instruction: |
      Este template guia a criação de um Project Brief completo, o insumo de base do desenvolvimento do produto.

      Comece perguntando ao usuário qual modo prefere:

      1. **Interativo**: trabalhar cada seção em conjunto
      2. **YOLO**: gerar o rascunho completo para revisão e refinamento

      Antes de começar, entenda quais insumos existem (resultados de brainstorming, pesquisa de mercado, análise de concorrentes, ideias iniciais) e reúna o contexto do projeto.

  - id: executive-summary
    title: Resumo Executivo
    instruction: |
      Crie uma visão geral concisa que capture a essência do projeto. Inclua:
      - O conceito do produto em 1 ou 2 frases
      - O problema principal resolvido
      - O mercado-alvo
      - A proposta de valor central
    template: "{{executive_summary_content}}"

  - id: problem-statement
    title: Definição do Problema
    instruction: |
      Descreva o problema com clareza e evidência. Aborde:
      - Situação atual e dores
      - Impacto do problema (quantifique quando possível)
      - Por que as soluções existentes não bastam
      - Urgência e importância de resolvê-lo agora
    template: "{{detailed_problem_description}}"

  - id: proposed-solution
    title: Solução Proposta
    instruction: |
      Descreva a abordagem de solução em alto nível. Inclua:
      - Conceito central e abordagem
      - Principais diferenciais em relação às soluções existentes
      - Por que esta solução vai dar certo onde outras falharam
      - Visão de alto nível do produto
    template: "{{solution_description}}"

  - id: target-users
    title: Usuários-Alvo
    instruction: |
      Defina e caracterize os usuários pretendidos com especificidade. Para cada segmento, inclua:
      - Perfil demográfico ou firmográfico
      - Comportamentos e fluxos de trabalho atuais
      - Necessidades e dores específicas
      - Objetivos que tentam alcançar
    sections:
      - id: primary-segment
        title: "Segmento Principal: {{segment_name}}"
        template: "{{primary_user_description}}"
      - id: secondary-segment
        title: "Segmento Secundário: {{segment_name}}"
        condition: Existe segmento secundário de usuários
        template: "{{secondary_user_description}}"

  - id: goals-metrics
    title: Objetivos e Métricas de Sucesso
    instruction: Defina objetivos claros e como medir o sucesso. Use objetivos SMART (específicos, mensuráveis, alcançáveis, relevantes e com prazo).
    sections:
      - id: business-objectives
        title: Objetivos de Negócio
        type: bullet-list
        template: "- {{objective_with_metric}}"
      - id: user-success-metrics
        title: Métricas de Sucesso do Usuário
        type: bullet-list
        template: "- {{user_metric}}"
      - id: kpis
        title: Indicadores-Chave de Desempenho (KPIs)
        type: bullet-list
        template: "- {{kpi}}: {{definition_and_target}}"

  - id: mvp-scope
    title: Escopo do MVP
    instruction: Defina o produto mínimo viável com clareza. Seja específico sobre o que entra e o que fica fora. Ajude o usuário a separar o indispensável do desejável.
    sections:
      - id: core-features
        title: Funcionalidades Essenciais (obrigatórias)
        type: bullet-list
        template: "- **{{feature}}:** {{description_and_rationale}}"
      - id: out-of-scope
        title: Fora do Escopo do MVP
        type: bullet-list
        template: "- {{feature_or_capability}}"
      - id: mvp-success-criteria
        title: Critérios de Sucesso do MVP
        template: "{{mvp_success_definition}}"

  - id: post-mvp-vision
    title: Visão Pós-MVP
    instruction: Descreva a direção de longo prazo do produto, sem se comprometer com detalhes.
    sections:
      - id: phase-2-features
        title: Funcionalidades da Fase 2
        template: "{{next_priority_features}}"
      - id: long-term-vision
        title: Visão de Longo Prazo
        template: "{{one_two_year_vision}}"
      - id: expansion-opportunities
        title: Oportunidades de Expansão
        template: "{{potential_expansions}}"

  - id: technical-considerations
    title: Considerações Técnicas
    instruction: Documente as restrições e preferências técnicas conhecidas. São ideias iniciais, não decisões finais. Use .sia-core/data/technical-preferences.md (stack padrão do SIA) como ponto de partida.
    sections:
      - id: platform-requirements
        title: Requisitos de Plataforma
        template: |
          - **Plataformas-alvo:** {{platforms}}
          - **Navegadores e sistemas suportados:** {{specific_requirements}}
          - **Requisitos de desempenho:** {{performance_specs}}
      - id: technology-preferences
        title: Preferências de Tecnologia
        template: |
          - **Frontend:** {{frontend_preferences}}
          - **Backend:** {{backend_preferences}}
          - **Banco de dados:** {{database_preferences}}
          - **Hospedagem e infraestrutura:** {{infrastructure_preferences}}
      - id: architecture-considerations
        title: Considerações de Arquitetura
        template: |
          - **Estrutura do repositório:** {{repo_thoughts}}
          - **Arquitetura de serviços:** {{service_thoughts}}
          - **Requisitos de integração:** {{integration_needs}}
          - **Segurança e conformidade:** {{security_requirements}}

  - id: constraints-assumptions
    title: Restrições e Premissas
    instruction: Declare com clareza as limitações e as premissas, para alinhar expectativas realistas.
    sections:
      - id: constraints
        title: Restrições
        template: |
          - **Orçamento:** {{budget_info}}
          - **Prazo:** {{timeline_info}}
          - **Recursos:** {{resource_info}}
          - **Técnicas:** {{technical_constraints}}
      - id: key-assumptions
        title: Premissas Principais
        type: bullet-list
        template: "- {{assumption}}"

  - id: risks-questions
    title: Riscos e Questões em Aberto
    instruction: Identifique de forma proativa as incertezas e os possíveis desafios.
    sections:
      - id: key-risks
        title: Riscos Principais
        type: bullet-list
        template: "- **{{risk}}:** {{description_and_impact}}"
      - id: open-questions
        title: Questões em Aberto
        type: bullet-list
        template: "- {{question}}"
      - id: research-areas
        title: Áreas que Pedem Mais Pesquisa
        type: bullet-list
        template: "- {{research_topic}}"

  - id: appendices
    title: Apêndices
    sections:
      - id: research-summary
        title: A. Resumo das Pesquisas
        condition: Existem achados de pesquisa
        instruction: |
          Quando houver, resuma os principais achados de:
          - Pesquisa de mercado
          - Análise de concorrentes
          - Entrevistas com usuários
          - Estudos de viabilidade técnica
      - id: stakeholder-input
        title: B. Contribuições das Partes Interessadas
        condition: Existe feedback de partes interessadas
        template: "{{stakeholder_feedback}}"
      - id: references
        title: C. Referências
        template: "{{relevant_links_and_docs}}"

  - id: next-steps
    title: Próximos Passos
    sections:
      - id: immediate-actions
        title: Ações Imediatas
        type: numbered-list
        template: "{{action_item}}"
      - id: pm-handoff
        title: Handoff para o PRD
        template: |
          Este Project Brief reúne o contexto completo de {{project_name}}. Próximo passo: `@pm *create-prd` (chapéu Produto). Revise o brief com atenção e construa o PRD seção a seção com o usuário, conforme o template, pedindo esclarecimentos ou sugerindo melhorias sempre que necessário.
