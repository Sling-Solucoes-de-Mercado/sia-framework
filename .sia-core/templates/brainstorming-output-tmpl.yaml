# Template do resultado de uma sessão de brainstorming.
# Usado por: @pm [Análise] em *brainstorm (task brainstorm), ao fim da sessão. Preenchido sem elicitação.
template:
  id: brainstorming-output-template
  name: Resultado da Sessão de Brainstorming
  version: 1.0
  output:
    format: markdown
    filename: docs/brainstorming-session-results.md
    title: Resultado da Sessão de Brainstorming

workflow:
  mode: non-interactive

sections:
  - id: header
    template: |
      **Data da sessão:** {{date}}
      **Facilitação:** {{agent_name}} ({{agent_role}})
      **Participante:** {{user_name}}

  - id: executive-summary
    title: Resumo Executivo
    sections:
      - id: summary-details
        template: |
          **Tema:** {{session_topic}}

          **Objetivos da sessão:** {{stated_goals}}

          **Técnicas usadas:** {{techniques_list}}

          **Total de ideias geradas:** {{total_ideas}}
      - id: key-themes
        title: "Temas principais identificados:"
        type: bullet-list
        template: "- {{theme}}"

  - id: technique-sessions
    title: Sessões por Técnica
    repeatable: true
    sections:
      - id: technique
        title: "{{technique_name}} ({{duration}})"
        sections:
          - id: description
            template: "**Descrição:** {{technique_description}}"
          - id: ideas-generated
            title: "Ideias geradas:"
            type: numbered-list
            template: "{{idea}}"
          - id: insights
            title: "Insights descobertos:"
            type: bullet-list
            template: "- {{insight}}"
          - id: connections
            title: "Conexões relevantes:"
            type: bullet-list
            template: "- {{connection}}"

  - id: idea-categorization
    title: Categorização das Ideias
    sections:
      - id: immediate-opportunities
        title: Oportunidades Imediatas
        instruction: Ideias prontas para implementar agora. Comece a subseção com a linha "*Ideias prontas para implementar agora*".
        repeatable: true
        type: numbered-list
        template: |
          **{{idea_name}}**
          - Descrição: {{description}}
          - Por que agora: {{rationale}}
          - Recursos necessários: {{requirements}}
      - id: future-innovations
        title: Inovações Futuras
        instruction: Ideias que exigem desenvolvimento ou pesquisa. Comece a subseção com a linha "*Ideias que exigem desenvolvimento ou pesquisa*".
        repeatable: true
        type: numbered-list
        template: |
          **{{idea_name}}**
          - Descrição: {{description}}
          - Desenvolvimento necessário: {{development_needed}}
          - Prazo estimado: {{timeline}}
      - id: moonshots
        title: Moonshots
        instruction: Conceitos ambiciosos e transformadores. Comece a subseção com a linha "*Conceitos ambiciosos e transformadores*".
        repeatable: true
        type: numbered-list
        template: |
          **{{idea_name}}**
          - Descrição: {{description}}
          - Potencial transformador: {{potential}}
          - Desafios a superar: {{challenges}}
      - id: insights-learnings
        title: Insights e Aprendizados
        instruction: Principais percepções da sessão. Comece a subseção com a linha "*Principais percepções da sessão*".
        type: bullet-list
        template: "- {{insight}}: {{description_and_implications}}"

  - id: action-planning
    title: Plano de Ação
    sections:
      - id: top-priorities
        title: As 3 Ideias Prioritárias
        sections:
          - id: priority-1
            title: "Prioridade 1: {{idea_name}}"
            template: |
              - Justificativa: {{rationale}}
              - Próximos passos: {{next_steps}}
              - Recursos necessários: {{resources}}
              - Prazo: {{timeline}}
          - id: priority-2
            title: "Prioridade 2: {{idea_name}}"
            template: |
              - Justificativa: {{rationale}}
              - Próximos passos: {{next_steps}}
              - Recursos necessários: {{resources}}
              - Prazo: {{timeline}}
          - id: priority-3
            title: "Prioridade 3: {{idea_name}}"
            template: |
              - Justificativa: {{rationale}}
              - Próximos passos: {{next_steps}}
              - Recursos necessários: {{resources}}
              - Prazo: {{timeline}}

  - id: reflection-followup
    title: Reflexão e Próximos Passos
    sections:
      - id: what-worked
        title: O Que Funcionou Bem
        type: bullet-list
        template: "- {{aspect}}"
      - id: areas-exploration
        title: Áreas para Explorar Mais
        type: bullet-list
        template: "- {{area}}: {{reason}}"
      - id: recommended-techniques
        title: Técnicas Recomendadas para a Continuação
        type: bullet-list
        template: "- {{technique}}: {{reason}}"
      - id: questions-emerged
        title: Perguntas que Surgiram
        type: bullet-list
        template: "- {{question}}"
      - id: next-session
        title: Planejamento da Próxima Sessão
        template: |
          - **Temas sugeridos:** {{followup_topics}}
          - **Prazo recomendado:** {{timeframe}}
          - **Preparação necessária:** {{preparation}}

  - id: footer
    template: |
      ---

      *Sessão facilitada com o método de brainstorming do SIA.*
